[project]
name = "job-scan-mcp"
version = "0.1.0"
description = "Job Screening MCP Server (Decoupled & Enterprise-Grade Architecture)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
    "fastmcp>=0.4.1",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "python-jobspy>=1.1.58",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.8",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
job-scan-mcp = "job_scan_mcp.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
