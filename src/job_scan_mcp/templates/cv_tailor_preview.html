<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Tailoring Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; }
        /* Paper / ATS look */
        .paper { background: #fff; color: #111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .paper h1 { font-size: 20pt; text-align: center; margin-bottom: 4px; font-weight: normal; }
        .paper .contact-info { text-align: center; font-size: 9.5pt; margin-bottom: 15px; color: #333; }
        .paper .section-title { font-size: 12pt; text-transform: uppercase; border-bottom: 1px solid #000; margin-top: 14px; margin-bottom: 8px; font-weight: bold; }
        .paper .item-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 2px; }
        .paper .item-subheader { display: flex; justify-content: space-between; font-style: italic; margin-bottom: 4px; font-size: 10pt; }
        .paper ul { margin-top: 0; padding-left: 20px; margin-bottom: 12px; }
        .paper li { margin-bottom: 3px; font-size: 10.5pt; line-height: 1.3; }
        .paper .summary { margin-bottom: 12px; font-size: 10pt; }
        .paper .skill-row { margin-bottom: 4px; font-size: 10pt; }
        .paper .bold { font-weight: bold; }

        /* Highlight engine */
        .bullet { position: relative; border-radius: 3px; transition: background .15s; }
        .bullet.highlighted { background: #fef3c7; box-shadow: inset 2px 0 0 #f59e0b; }
        .bullet .tooltip {
            position: absolute; left: 0; right: auto; bottom: calc(100% + 6px);
            z-index: 20; display: none; width: max-content; max-width: 300px;
            background: #1e293b; color: #e2e8f0; font-size: 10.5px; line-height: 1.35;
            padding: 6px 8px; border-radius: 6px; border: 1px solid #475569;
            box-shadow: 0 6px 16px rgba(0,0,0,.25);
        }
        .bullet.highlighted:hover .tooltip { display: block; }
    </style>
</head>
<body class="h-full antialiased overflow-x-hidden">

    <div class="max-w-[1500px] mx-auto px-6 py-6 flex flex-col gap-5" x-data="cvPreviewApp()">

        <!-- Header -->
        <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-bold text-white">Dynamic CV Tailoring — Preview</h1>
                <p class="text-xs text-slate-500 mt-0.5">Review the adapted CV. Yellow highlights mark bullets rewritten for this JD.</p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <!-- Highlights toggle -->
                <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer bg-slate-900 border border-slate-800 rounded-lg px-3 py-2">
                    <span>Show highlights</span>
                    <button type="button" @click="showHighlights = !showHighlights"
                            class="relative inline-flex h-5 w-9 items-center rounded-full transition"
                            :class="showHighlights ? 'bg-amber-500' : 'bg-slate-700'">
                        <span class="inline-block h-4 w-4 transform rounded-full bg-white transition"
                              :class="showHighlights ? 'translate-x-4' : 'translate-x-0.5'"></span>
                    </button>
                </label>
                <button @click="exportPdf()" title="Export the approved CV to PDF via the MCP tool export_cv_to_pdf"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition inline-flex items-center gap-1.5">
                    <i data-lucide="file-down" class="w-3.5 h-3.5"></i> Export PDF
                </button>
                <button @click="downloadJson()" title="Download the tailored CV as JSON"
                        class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 text-xs font-semibold px-3 py-2 rounded-lg transition inline-flex items-center gap-1.5">
                    <i data-lucide="braces" class="w-3.5 h-3.5"></i> JSON
                </button>
                <button @click="downloadCleanHtml()" title="Download the clean ATS HTML (no highlights)"
                        class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 text-xs font-semibold px-3 py-2 rounded-lg transition inline-flex items-center gap-1.5">
                    <i data-lucide="file-code" class="w-3.5 h-3.5"></i> HTML
                </button>
            </div>
        </header>

        <!-- Legend -->
        <div class="flex items-center gap-4 text-xs text-slate-400">
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-amber-200 inline-block"></span> Modified for this JD</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-slate-200 inline-block"></span> Unchanged</span>
            <span class="text-slate-600"><span x-text="modifiedCount()"></span> / <span x-text="totalBullets()"></span> bullets modified</span>
        </div>

        <!-- Layout: actions rail + paper preview -->
        <div class="flex flex-col lg:flex-row gap-6 items-start">

            <!-- Left rail: job-fit notes -->
            <aside class="w-full lg:w-72 shrink-0 flex flex-col gap-3 bg-slate-900/40 border border-slate-800 rounded-xl p-4 sticky top-4 max-h-[calc(100vh-2rem)] overflow-y-auto overscroll-contain">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Why each change</h2>
                <template x-for="(job, ji) in cv.experience" :key="ji">
                    <div class="flex flex-col gap-1">
                        <span class="text-xs font-semibold text-slate-200" x-text="job.title"></span>
                        <template x-for="(b, bi) in job.bullets" :key="bi">
                            <div x-show="b.modified" class="text-[11px] text-slate-400 border-l-2 border-amber-500/60 pl-2 py-0.5">
                                <span x-text="b.match_reason || 'Adapted for this JD.'"></span>
                            </div>
                        </template>
                    </div>
                </template>
                <p x-show="modifiedCount() === 0" class="text-xs text-slate-600 italic">No bullets were modified.</p>
            </aside>

            <!-- Paper preview -->
            <section class="flex-1 min-w-0">
                <div class="paper mx-auto w-full max-w-[820px] bg-white shadow-2xl rounded-sm p-10">
                    <h1 x-text="cv.name || ''"></h1>
                    <div class="contact-info" x-text="(cv.contact || []).join('  |  ')"></div>
                    <div class="summary" x-text="cv.summary || ''"></div>

                    <div class="section-title">Experience</div>
                    <template x-for="(job, ji) in cv.experience" :key="ji">
                        <div>
                            <div class="item-header">
                                <span x-text="job.title"></span><span x-text="job.date"></span>
                            </div>
                            <div class="item-subheader">
                                <span x-text="job.company"></span><span x-text="job.location"></span>
                            </div>
                            <ul>
                                <template x-for="(b, bi) in job.bullets" :key="bi">
                                    <li class="bullet" :class="bulletCls(b)">
                                        <span x-text="b.text"></span>
                                        <span x-show="showHighlights && b.modified && b.match_reason" class="tooltip" x-text="b.match_reason"></span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>

                    <template x-if="(cv.education || []).length">
                        <div>
                            <div class="section-title">Education</div>
                            <template x-for="(edu, ei) in cv.education" :key="ei">
                                <div>
                                    <div class="item-header"><span x-text="edu.degree"></span><span x-text="edu.year"></span></div>
                                    <div class="item-subheader"><span x-text="edu.institution"></span><span></span></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template x-if="Object.keys(cv.skills || {}).length">
                        <div>
                            <div class="section-title">Skills</div>
                            <div class="flex flex-col gap-1">
                                <template x-for="(items, group) in cv.skills" :key="group">
                                    <div class="skill-row">
                                        <span class="bold" x-text="group + ':'"></span>
                                        <span x-text="' ' + (items || []).join(', ')"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </section>
        </div>
    </div>

    <!-- Toast -->
    <div x-data="{ msg: '' }" x-on:toast.window="msg = $event.detail; $el.style.opacity = 1; clearTimeout($el._t); $el._t = setTimeout(() => $el.style.opacity = 0, 2200)"
         x-init="$el.style.opacity = 0" style="transition: opacity .25s"
         class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 border border-indigo-500/40 text-slate-100 text-sm font-medium px-4 py-2 rounded-lg shadow-xl z-50 pointer-events-none">
        <span x-text="msg"></span>
    </div>

    <script>
        window.tailoredCV = {{ tailored | tojson }};

        function cvPreviewApp() {
            return {
                cv: window.tailoredCV || {},
                showHighlights: true,

                modifiedCount() {
                    return (this.cv.experience || []).reduce((s, j) => s + (j.bullets || []).filter(b => b.modified).length, 0);
                },
                totalBullets() {
                    return (this.cv.experience || []).reduce((s, j) => s + (j.bullets || []).length, 0);
                },
                bulletCls(b) {
                    return this.showHighlights && b.modified ? 'highlighted' : '';
                },

                /* ----- export actions (static UI: the real PDF move happens via the MCP tool) ----- */
                exportPdf() {
                    this.copyText(JSON.stringify(this.cv, null, 2));
                    this.$dispatch('toast', 'Tailored CV JSON copied — run the MCP tool export_cv_to_pdf to generate the PDF.');
                },
                downloadJson() {
                    this.download('tailored_cv.json', JSON.stringify(this.cv, null, 2), 'application/json');
                },
                downloadCleanHtml() {
                    this.download('tailored_cv.html', this.buildCleanHtml(), 'text/html;charset=utf-8');
                },
                copyText(text) {
                    const done = () => this.$dispatch('toast', 'Copied to clipboard');
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(done).catch(() => this.fallbackCopy(text) && done());
                    } else { this.fallbackCopy(text) && done(); }
                },
                fallbackCopy(text) {
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                        document.body.appendChild(ta); ta.select();
                        const ok = document.execCommand('copy');
                        document.body.removeChild(ta); return ok;
                    } catch (e) { return false; }
                },
                download(name, content, type) {
                    const blob = new Blob([content], { type });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob); a.download = name;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(a.href);
                },

                /* ----- clean ATS HTML builder (no highlights) ----- */
                buildCleanHtml() {
                    const cv = this.cv;
                    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const bullets = (job) => (job.bullets || []).map(b => `<li>${esc(b.text || '')}</li>`).join('');
                    const exp = (cv.experience || []).map(job => `
                        <div>
                            <div class="item-header"><span>${esc(job.title)}</span><span>${esc(job.date)}</span></div>
                            <div class="item-subheader"><span>${esc(job.company)}</span><span>${esc(job.location)}</span></div>
                            <ul>${bullets(job)}</ul>
                        </div>`).join('');
                    const edu = (cv.education || []).map(e => `
                        <div><div class="item-header"><span>${esc(e.degree)}</span><span>${esc(e.year)}</span></div>
                        <div class="item-subheader"><span>${esc(e.institution)}</span><span></span></div></div>`).join('');
                    const skills = Object.entries(cv.skills || {}).map(([g, items]) =>
                        `<div class="skill-row"><span class="bold">${esc(g)}:</span> ${esc((items || []).join(', '))}</div>`).join('');
                    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@page{margin:0.5in}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#111;line-height:1.3;font-size:10.5pt}
h1{font-size:20pt;text-align:center;margin-bottom:4px;font-weight:normal}
.contact-info{text-align:center;font-size:9.5pt;margin-bottom:15px;color:#333}
.section-title{font-size:12pt;text-transform:uppercase;border-bottom:1px solid #000;margin-top:12px;margin-bottom:8px;font-weight:bold}
.item-header{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:2px}
.item-subheader{display:flex;justify-content:space-between;font-style:italic;margin-bottom:4px;font-size:10pt}
ul{margin-top:0;padding-left:20px;margin-bottom:12px}li{margin-bottom:3px}
.summary{margin-bottom:12px;font-size:10pt}.skill-row{margin-bottom:4px;font-size:10pt}.bold{font-weight:bold}
</style></head><body>
<h1>${esc(cv.name)}</h1>
<div class="contact-info">${esc((cv.contact || []).join(' | '))}</div>
<div class="summary">${esc(cv.summary)}</div>
<div class="section-title">Experience</div>${exp}
${edu ? '<div class="section-title">Education</div>' + edu : ''}
${skills ? '<div class="section-title">Skills</div>' + skills : ''}
</body></html>`;
                }
            }
        }
    </script>
</body>
</html>
